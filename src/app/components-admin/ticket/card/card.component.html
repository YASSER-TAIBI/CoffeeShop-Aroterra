<div class="card hover-effect"
     draggable="true"
     (dragstart)="onDragStart($event)"
     (click)="editCard()">
  <div class="card-header">
    <h3>{{ card.title }}</h3>
    <button class="delete-btn" (click)="deleteCard($event)">×</button>
  </div>
  <p class="card-description">{{ card.description }}</p>
  <div class="card-footer">
    <div class="card-type"
         [class.bug]="card.type === 'Bug'"
         [class.evolution]="card.type === 'Evol'">
      {{ card.type }}
    </div>
    <div class="card-priorite">
    <!-- Image correspondant à la priorité -->
    <img [src]="getPrioriteImage()" alt="Priorite" class="priorite-image">
    </div>
  </div>
</div>
